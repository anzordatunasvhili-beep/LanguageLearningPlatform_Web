project_id = "kotoba-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
# Local origins only; allows the callback's validated next query parameter.
# Hosted deployments must configure their own trusted redirect allowlist.
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "25MiB"

[functions.ai-conversation]
# Authentication is enforced inside the function with auth.getUser(token).
verify_jwt = false
